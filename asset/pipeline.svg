<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" width="980" height="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Instruction -->
  <rect x="14" y="62" width="150" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="89" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">Instruction</text>
  <text x="89" y="111" text-anchor="middle" font-size="11.5" fill="#57606a">natural language</text>

  <path d="M 174 95 L 198 95" stroke="#8b949e" stroke-width="2"/>
  <path d="M 198 89 L 208 95 L 198 101 Z" fill="#8b949e"/>

  <!-- Router -->
  <rect x="216" y="55" width="152" height="80" rx="10" fill="#3b6fa8"/>
  <text x="292" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Olympus</text>
  <text x="292" y="109" text-anchor="middle" font-size="11.5" fill="#dce8f5">universal router</text>

  <path d="M 378 95 L 402 95" stroke="#8b949e" stroke-width="2"/>
  <path d="M 402 89 L 412 95 L 402 101 Z" fill="#8b949e"/>

  <!-- Routing tokens -->
  <rect x="420" y="52" width="176" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="508" y="78" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292f">Routing tokens</text>
  <text x="508" y="101" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0550ae">&lt;image_gen&gt;</text>
  <text x="508" y="120" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0550ae">&lt;3D_gen_image&gt; …</text>

  <path d="M 606 95 L 630 95" stroke="#8b949e" stroke-width="2"/>
  <path d="M 630 89 L 640 95 L 630 101 Z" fill="#8b949e"/>

  <!-- Specialists -->
  <rect x="648" y="55" width="152" height="80" rx="10" fill="#a85c3b"/>
  <text x="724" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Specialists</text>
  <text x="724" y="109" text-anchor="middle" font-size="11.5" fill="#f7e2d8">20 vision tasks</text>

  <path d="M 810 95 L 834 95" stroke="#8b949e" stroke-width="2"/>
  <path d="M 834 89 L 844 95 L 834 101 Z" fill="#8b949e"/>

  <!-- Assets -->
  <rect x="852" y="62" width="116" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="910" y="90" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292f">Assets</text>
  <text x="910" y="111" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a7f37">.png .mp4 .glb</text>

  <!-- chaining -->
  <path d="M 508 148 C 508 178, 724 178, 724 148" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="616" y="194" text-anchor="middle" font-size="11.5" fill="#57606a">outputs chain between steps</text>
</svg>
